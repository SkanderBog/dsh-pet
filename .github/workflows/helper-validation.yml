name: Helper process validation
on:
  push:
    branches: [validation/helper-spawn-20261010]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm test
      - run: npm run prepack
